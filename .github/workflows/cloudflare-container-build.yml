name: Cloudflare Container Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cloudflare-container-build.yml"
      - ".dockerignore"
      - "Dockerfile.earnings"
      - "requirements.txt"
      - "cloudflare/container_server.py"
      - "core/**"
      - "pipelines/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: surocap-earnings-runtime:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production Python image
        run: docker build --platform linux/amd64 --file Dockerfile.earnings --tag "${IMAGE_TAG}" .
      - name: Verify image platform
        run: test "$(docker image inspect "${IMAGE_TAG}" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
      - name: Sign in to Cloudflare container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CF_REGISTRY_USERNAME }}
          password: ${{ secrets.CF_REGISTRY_PASSWORD }}
      - name: Publish authorized production image
        run: |
          RELEASE_IMAGE="registry.cloudflare.com/438315c143db6c8a694dfb38757616c9/surocap-earnings-runtime:snapshot-cache-20260826-v4"
          docker tag "${IMAGE_TAG}" "${RELEASE_IMAGE}"
          docker push "${RELEASE_IMAGE}"
      - name: Smoke-test production coverage routing
        run: >-
          docker run --rm --entrypoint python "${IMAGE_TAG}" -c
          "from core.earnings_universe import EMAIL_DEEP_DIVE_TICKERS;
          from core.coverage import EMAIL_DEMOTED_TICKERS, dashboard_only_tickers;
          from cloudflare.container_server import job_commands;
          site_only = dashboard_only_tickers();
          assert len(EMAIL_DEEP_DIVE_TICKERS) == 88;
          assert EMAIL_DEMOTED_TICKERS <= site_only;
          assert not (EMAIL_DEEP_DIVE_TICKERS & site_only);
          assert '--dashboard-only' in job_commands('pre-earnings')[-1];
          assert '--dashboard-only' in job_commands('post-amc')[-1]"
      - name: Export image
        run: docker save --output surocap-earnings-runtime.tar "${IMAGE_TAG}"
      - name: Upload image for the authorized Cloudflare release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surocap-earnings-runtime-${{ github.sha }}
          path: surocap-earnings-runtime.tar
          compression-level: 0
          retention-days: 1
